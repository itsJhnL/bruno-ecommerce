                L 584.44 1200 C 571.7 820 526.21 560 546.21 200 Z"
             fill="#000000" fill-opacity="0.15"/><path d="M 618.33 200 C 598.33 560 611.33 820 607.83 1200
                L 660.4 1200 C 663.9 820 650.9 560 670.9 200 Z"
