    C 780 644 654 744 500 744
    C 346 744 220 644 220 520
    C 220 396 346 296 500 296
    Z
    M 500 396
    C 402 396 322 452 322 520
    C 322 588 402 644 500 644
    C 598 644 678 588 678 520
