      <rect x="0" y="0" width="1000" height="1250" fill="url(#onyx-calfskin-belt-material-spec)"/>
      <rect x="0" y="0" width="1000" height="1250" fill="url(#onyx-calfskin-belt-material-round)"/>
      <path d="M 220 520 C 220 644 346 744 500 744 C 654 744 780 644 780 520 L 678 520 C 678 588 598 644 500 644 C 402 644 322 588 322 520 Z" fill="#000000" fill-opacity="0.34" fill-rule="evenodd"/><path d="M 322 540 C 300 640 320 760 396 846 L 440 812 C 380 736 372 630 384 552 Z" fill="#a8783f" fill-opacity="0.12" fill-rule="evenodd"/>
    </g>
