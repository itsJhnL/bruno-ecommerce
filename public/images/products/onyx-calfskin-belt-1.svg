               transform="translate(0 -2.2)" stroke-linecap="round"/><path d="M 500 724 C 360 722 242 634 240 520" fill="none" stroke="#000000" stroke-opacity="0.42" stroke-width="3.4" stroke-linecap="round"/><path d="M 500 724 C 360 722 242 634 240 520" fill="none" stroke="#a8783f" stroke-opacity="0.16" stroke-width="1.2"
               transform="translate(0 -2.2)" stroke-linecap="round"/><path d="M 500 330 C 626 334 740 412 742 520" fill="none" stroke="#e3cba0" stroke-opacity="0.34" stroke-width="2.2"
               stroke-dasharray="7 9" stroke-linecap="round"/><path d="M 500 710 C 374 706 260 628 258 520" fill="none" stroke="#e3cba0" stroke-opacity="0.34" stroke-width="2.2"
