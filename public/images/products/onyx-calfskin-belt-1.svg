<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="onyx-calfskin-belt-material-ground" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%"   stop-color="#0d0c11"/>
      <stop offset="55%"  stop-color="#131218"/>
      <stop offset="100%" stop-color="#08070a"/>
    </linearGradient>
    <radialGradient id="onyx-calfskin-belt-material-bloom" cx="0.78" cy="0.14" r="0.74">
      <stop offset="0%"   stop-color="#c9a96a" stop-opacity="0.30"/>
      <stop offset="44%"  stop-color="#9a7c42" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#9a7c42" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="onyx-calfskin-belt-material-cool" cx="0.12" cy="0.86" r="0.62">
      <stop offset="0%"   stop-color="#7e96b8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7e96b8" stop-opacity="0"/>
    </radialGradient>
    <!-- The cloth: shadow to body to highlight, raked from the light side. -->
    <linearGradient id="onyx-calfskin-belt-material-cloth" x1="1" y1="0.06" x2="0" y2="0.96">
      <stop offset="0%"   stop-color="#a8783f" stop-opacity="0.38"/>
      <stop offset="20%"  stop-color="#432c17"/>
      <stop offset="64%"  stop-color="#432c17"/>
      <stop offset="100%" stop-color="#150e09"/>
    </linearGradient>
    <!-- Specular band. Silk gets a hard one, suede almost none. -->
    <linearGradient id="onyx-calfskin-belt-material-spec" x1="0.42" y1="0" x2="1.1" y2="0.72">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="44%"  stop-color="#eddcbd" stop-opacity="0.1"/>
      <stop offset="53%"  stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="63%"  stop-color="#eddcbd" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Turns a flat fill into something with a near and a far edge. -->
    <linearGradient id="onyx-calfskin-belt-material-round" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="66%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="onyx-calfskin-belt-material-contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Findings. Fixed ids: garments.ts refers to them by name. -->
    <linearGradient id="brass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#eddcbd"/>
      <stop offset="42%"  stop-color="#c9a96a"/>
      <stop offset="100%" stop-color="#9a7c42"/>
    </linearGradient>
    <radialGradient id="horn" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0%"   stop-color="#a8783f" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#150e09"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="leatherStrap" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#a8783f"/>
      <stop offset="50%"  stop-color="#432c17"/>
      <stop offset="100%" stop-color="#150e09"/>
    </linearGradient>
    <pattern id="onyx-calfskin-belt-material-weave" width="30" height="26" patternUnits="userSpaceOnUse">
        <ellipse cx="8" cy="7" rx="6.2" ry="4.8" fill="#a8783f" fill-opacity="0.09"/>
        <ellipse cx="22" cy="19" rx="7.4" ry="5.2" fill="#a8783f" fill-opacity="0.07"/>
        <ellipse cx="24" cy="5" rx="4.2" ry="3.6" fill="#000000" fill-opacity="0.16"/>
        <ellipse cx="6" cy="21" rx="5" ry="4" fill="#000000" fill-opacity="0.13"/>
      </pattern>
    <clipPath id="onyx-calfskin-belt-material-clip"><path d="
    M 500 296
    C 654 296 780 396 780 520
    C 780 644 654 744 500 744
    C 346 744 220 644 220 520
    C 220 396 346 296 500 296
