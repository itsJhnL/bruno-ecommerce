<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="halo-silk-scarf-material-ground" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%"   stop-color="#0d0c11"/>
      <stop offset="55%"  stop-color="#131218"/>
      <stop offset="100%" stop-color="#08070a"/>
    </linearGradient>
    <radialGradient id="halo-silk-scarf-material-bloom" cx="0.78" cy="0.14" r="0.74">
      <stop offset="0%"   stop-color="#c9a96a" stop-opacity="0.30"/>
      <stop offset="44%"  stop-color="#9a7c42" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#9a7c42" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-silk-scarf-material-cool" cx="0.12" cy="0.86" r="0.62">
      <stop offset="0%"   stop-color="#7e96b8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7e96b8" stop-opacity="0"/>
    </radialGradient>
    <!-- The cloth: shadow to body to highlight, raked from the light side. -->
    <linearGradient id="halo-silk-scarf-material-cloth" x1="1" y1="0.06" x2="0" y2="0.96">
      <stop offset="0%"   stop-color="#ded2c2" stop-opacity="0.38"/>
      <stop offset="20%"  stop-color="#544d5c"/>
      <stop offset="64%"  stop-color="#544d5c"/>
      <stop offset="100%" stop-color="#191720"/>
    </linearGradient>
    <!-- Specular band. Silk gets a hard one, suede almost none. -->
    <linearGradient id="halo-silk-scarf-material-spec" x1="0.42" y1="0" x2="1.1" y2="0.72">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="44%"  stop-color="#eddcbd" stop-opacity="0.15"/>
      <stop offset="53%"  stop-color="#ffffff" stop-opacity="0.23"/>
      <stop offset="63%"  stop-color="#eddcbd" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Turns a flat fill into something with a near and a far edge. -->
    <linearGradient id="halo-silk-scarf-material-round" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="66%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="halo-silk-scarf-material-contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Findings. Fixed ids: garments.ts refers to them by name. -->
    <linearGradient id="brass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#eddcbd"/>
      <stop offset="42%"  stop-color="#c9a96a"/>
      <stop offset="100%" stop-color="#9a7c42"/>
    </linearGradient>
    <radialGradient id="horn" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0%"   stop-color="#ded2c2" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#191720"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="leatherStrap" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#a8783f"/>
      <stop offset="50%"  stop-color="#432c17"/>
      <stop offset="100%" stop-color="#150e09"/>
    </linearGradient>
    <pattern id="halo-silk-scarf-material-weave" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
        <line x1="0" y1="0" x2="0" y2="24" stroke="#ded2c2" stroke-opacity="0.10" stroke-width="3.2"/>
        <line x1="12" y1="0" x2="12" y2="24" stroke="#000000" stroke-opacity="0.10" stroke-width="4.8"/>
      </pattern>
    <clipPath id="halo-silk-scarf-material-clip"><path d="
    M 446 258
    C 400 268 372 300 366 344
    C 340 500 300 700 258 914
    L 408 954
    C 440 720 468 520 492 372
    C 516 520 544 720 576 954
    L 726 914
    C 684 700 644 500 618 344
    C 612 300 584 268 538 258
    C 566 300 570 336 556 366
    C 534 306 466 306 444 366
    C 430 336 434 300 446 258
    Z" clip-rule="evenodd"/></clipPath>
  </defs>
