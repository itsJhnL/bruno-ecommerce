                L 825.88 1200 C 811.99 820 764.22 560 784.22 200 Z"
             fill="#ded2c2" fill-opacity="0.11"/>
      <rect x="0" y="0" width="1000" height="1250" fill="url(#halo-silk-scarf-material-spec)"/>
      <rect x="0" y="0" width="1000" height="1250" fill="url(#halo-silk-scarf-material-round)"/>
      <path d="M 444 366 C 466 306 534 306 556 366
            C 534 336 466 336 444 366 Z" fill="#000000" fill-opacity="0.55" fill-rule="evenodd"/><path d="M 492 372 C 516 520 544 720 576 954
