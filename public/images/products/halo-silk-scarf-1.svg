  </g>
  <filter id="halo-silk-scarf-material-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.52  0 0 0 0 0.47  0 0 0 0.6 0"/>
  </filter>
  <rect width="1000" height="1250" filter="url(#halo-silk-scarf-material-grain)" opacity="0.075" style="mix-blend-mode:overlay"/>
  <text x="926" y="1198" font-family="Cormorant Garamond, Georgia, serif" font-size="22"
