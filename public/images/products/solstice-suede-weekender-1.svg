      <rect x="0" y="0" width="1000" height="1250" fill="url(#solstice-suede-weekender-material-round)"/>
      <path d="M 686 484 C 732 486 764 512 764 552 C 776 660 776 774 760 862 C 754 902 716 924 664 926 C 700 890 710 700 700 552 C 698 512 694 496 686 484 Z" fill="#000000" fill-opacity="0.38" fill-rule="evenodd"/><path d="M 236 552 C 236 512 268 486 314 484 L 686 484 C 732 486 764 512 764 552 C 640 528 360 528 236 552 Z" fill="#000000" fill-opacity="0.3" fill-rule="evenodd"/><path d="M 240 830 C 400 872 600 872 760 830 C 756 878 750 902 736 914 L 264 914 C 250 902 244 878 240 830 Z" fill="#000000" fill-opacity="0.3" fill-rule="evenodd"/><path d="M 412 380 L 436 380 L 436 452 L 412 452 Z" fill="#a37f4f" fill-opacity="0.12" fill-rule="evenodd"/><path d="M 564 380 L 588 380 L 588 452 L 564 452 Z" fill="#a37f4f" fill-opacity="0.12" fill-rule="evenodd"/>
    </g>
