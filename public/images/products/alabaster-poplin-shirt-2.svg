    <radialGradient id="alabaster-poplin-shirt-detail-cool" cx="0.12" cy="0.86" r="0.62">
      <stop offset="0%"   stop-color="#7e96b8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7e96b8" stop-opacity="0"/>
    </radialGradient>
    <!-- The cloth: shadow to body to highlight, raked from the light side. -->
    <linearGradient id="alabaster-poplin-shirt-detail-cloth" x1="1" y1="0.06" x2="0" y2="0.96">
      <stop offset="0%"   stop-color="#d2d6db" stop-opacity="0.38"/>
      <stop offset="20%"  stop-color="#464b53"/>
      <stop offset="64%"  stop-color="#464b53"/>
      <stop offset="100%" stop-color="#14161a"/>
    </linearGradient>
    <!-- Specular band. Silk gets a hard one, suede almost none. -->
    <linearGradient id="alabaster-poplin-shirt-detail-spec" x1="0.42" y1="0" x2="1.1" y2="0.72">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
