<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sable-cashmere-wrap-material-ground" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%"   stop-color="#0d0c11"/>
      <stop offset="55%"  stop-color="#131218"/>
      <stop offset="100%" stop-color="#08070a"/>
    </linearGradient>
    <radialGradient id="sable-cashmere-wrap-material-bloom" cx="0.78" cy="0.14" r="0.74">
      <stop offset="0%"   stop-color="#c9a96a" stop-opacity="0.30"/>
      <stop offset="44%"  stop-color="#9a7c42" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#9a7c42" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sable-cashmere-wrap-material-cool" cx="0.12" cy="0.86" r="0.62">
      <stop offset="0%"   stop-color="#7e96b8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7e96b8" stop-opacity="0"/>
    </radialGradient>
    <!-- The cloth: shadow to body to highlight, raked from the light side. -->
    <linearGradient id="sable-cashmere-wrap-material-cloth" x1="1" y1="0.06" x2="0" y2="0.96">
      <stop offset="0%"   stop-color="#c9b28d" stop-opacity="0.38"/>
      <stop offset="20%"  stop-color="#4c3c2b"/>
      <stop offset="64%"  stop-color="#4c3c2b"/>
      <stop offset="100%" stop-color="#1a160f"/>
    </linearGradient>
    <!-- Specular band. Silk gets a hard one, suede almost none. -->
    <linearGradient id="sable-cashmere-wrap-material-spec" x1="0.42" y1="0" x2="1.1" y2="0.72">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="44%"  stop-color="#eddcbd" stop-opacity="0.06"/>
      <stop offset="53%"  stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="63%"  stop-color="#eddcbd" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Turns a flat fill into something with a near and a far edge. -->
    <linearGradient id="sable-cashmere-wrap-material-round" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="66%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="sable-cashmere-wrap-material-contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Findings. Fixed ids: garments.ts refers to them by name. -->
    <linearGradient id="brass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#eddcbd"/>
      <stop offset="42%"  stop-color="#c9a96a"/>
      <stop offset="100%" stop-color="#9a7c42"/>
    </linearGradient>
    <radialGradient id="horn" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0%"   stop-color="#c9b28d" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#1a160f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="leatherStrap" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#a8783f"/>
      <stop offset="50%"  stop-color="#432c17"/>
      <stop offset="100%" stop-color="#150e09"/>
    </linearGradient>
    <pattern id="sable-cashmere-wrap-material-weave" width="35" height="35" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
        <line x1="0" y1="7"     x2="35" y2="9.8" stroke="#c9b28d" stroke-opacity="0.11" stroke-width="2.38"/>
        <line x1="0" y1="18.2" x2="35" y2="15.4" stroke="#000000" stroke-opacity="0.14" stroke-width="3.5"/>
        <line x1="0" y1="28" x2="35" y2="30.8" stroke="#c9b28d" stroke-opacity="0.08" stroke-width="1.96"/>
      </pattern>
    <clipPath id="sable-cashmere-wrap-material-clip"><path d="
    M 432 258
    C 374 268 339 300 331 344
    C 298 500 248 700 195 950
    L 384 990
    C 424 720 460 520 490 372
    C 520 520 555 720 596 990
    L 785 950
    C 732 700 681 500 649 344
    C 641 300 606 268 548 258
    C 583 300 588 336 571 366
    C 543 306 457 306 429 366
    C 412 336 417 300 432 258
    Z" clip-rule="evenodd"/></clipPath>
