  <defs>
    <linearGradient id="category-outerwear-material-ground" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%"   stop-color="#0d0c11"/>
      <stop offset="55%"  stop-color="#131218"/>
      <stop offset="100%" stop-color="#08070a"/>
    </linearGradient>
    <radialGradient id="category-outerwear-material-bloom" cx="0.22" cy="0.14" r="0.74">
      <stop offset="0%"   stop-color="#c9a96a" stop-opacity="0.30"/>
      <stop offset="44%"  stop-color="#9a7c42" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#9a7c42" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="category-outerwear-material-cool" cx="0.88" cy="0.86" r="0.62">
      <stop offset="0%"   stop-color="#7e96b8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7e96b8" stop-opacity="0"/>
    </radialGradient>
    <!-- The cloth: shadow to body to highlight, raked from the light side. -->
    <linearGradient id="category-outerwear-material-cloth" x1="0" y1="0.06" x2="1" y2="0.96">
      <stop offset="0%"   stop-color="#8f97a6" stop-opacity="0.38"/>
      <stop offset="20%"  stop-color="#343945"/>
      <stop offset="64%"  stop-color="#343945"/>
      <stop offset="100%" stop-color="#131519"/>
    </linearGradient>
    <!-- Specular band. Silk gets a hard one, suede almost none. -->
    <linearGradient id="category-outerwear-material-spec" x1="-0.1" y1="0" x2="0.58" y2="0.72">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="44%"  stop-color="#eddcbd" stop-opacity="0.04"/>
      <stop offset="53%"  stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="63%"  stop-color="#eddcbd" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Turns a flat fill into something with a near and a far edge. -->
    <linearGradient id="category-outerwear-material-round" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="34%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="category-outerwear-material-contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Findings. Fixed ids: garments.ts refers to them by name. -->
    <linearGradient id="brass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#eddcbd"/>
      <stop offset="42%"  stop-color="#c9a96a"/>
      <stop offset="100%" stop-color="#9a7c42"/>
    </linearGradient>
    <radialGradient id="horn" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0%"   stop-color="#8f97a6" stop-opacity="0.85"/>
      <stop offset="55%"  stop-color="#131519"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="leatherStrap" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#a8783f"/>
      <stop offset="50%"  stop-color="#432c17"/>
      <stop offset="100%" stop-color="#150e09"/>
    </linearGradient>
    <pattern id="category-outerwear-material-weave" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
