      <stop offset="64%"  stop-color="#464b53"/>
      <stop offset="100%" stop-color="#14161a"/>
    </linearGradient>
    <!-- Specular band. Silk gets a hard one, suede almost none. -->
    <linearGradient id="category-shirting-material-spec" x1="0.42" y1="0" x2="1.1" y2="0.72">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
