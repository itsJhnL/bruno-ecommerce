  <defs>
    <linearGradient id="category-leather-material-ground" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%"   stop-color="#0d0c11"/>
      <stop offset="55%"  stop-color="#131218"/>
      <stop offset="100%" stop-color="#08070a"/>
    </linearGradient>
    <radialGradient id="category-leather-material-bloom" cx="0.78" cy="0.14" r="0.74">
